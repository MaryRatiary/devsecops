apiVersion: v1
kind: Namespace
metadata:
  name: lyrx
  labels:
    app.kubernetes.io/name: lyrx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lyrx
  namespace: lyrx
  labels:
    app.kubernetes.io/name: lyrx
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lyrx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lyrx
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lyrx
          image: harbor.example.com/mlops/lyrx:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ENV
              value: production
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: lyrx
  namespace: lyrx
  labels:
    app.kubernetes.io/name: lyrx
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lyrx
  ports:
    - name: http
      port: 80
      targetPort: http
