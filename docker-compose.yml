services:
  lyrx:
    build:
      context: ${APP_BUILD_CONTEXT:-.}
      dockerfile: ${APP_DOCKERFILE:-Dockerfile}
    image: ${APP_IMAGE:-localhost:8082/mlops/lyrx:1.0.0}
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      ENV: ${APP_ENV:-production}
    restart: ${APP_RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: ${APP_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${APP_HEALTHCHECK_TIMEOUT:-10s}
      retries: ${APP_HEALTHCHECK_RETRIES:-3}
      start_period: ${APP_HEALTHCHECK_START_PERIOD:-40s}

  jenkins:
    build:
      context: ${JENKINS_BUILD_CONTEXT:-.}
      dockerfile: ${JENKINS_DOCKERFILE:-docker/jenkins/Dockerfile}
    image: ${JENKINS_IMAGE:-lyrx-jenkins:2.559-jdk17}
    user: ${JENKINS_USER:-root}
    ports:
      - "${JENKINS_HTTP_PORT:-8081}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - ${JENKINS_HOME_VOLUME:-jenkins_home}:/var/jenkins_home
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    restart: ${JENKINS_RESTART_POLICY:-unless-stopped}

  sonarqube:
    image: ${SONARQUBE_IMAGE:-sonarqube:10.7-community}
    depends_on:
      - sonar-db
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/${SONAR_DB_NAME:-sonar}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - ${SONARQUBE_DATA_VOLUME:-sonarqube_data}:/opt/sonarqube/data
      - ${SONARQUBE_EXTENSIONS_VOLUME:-sonarqube_extensions}:/opt/sonarqube/extensions
      - ${SONARQUBE_LOGS_VOLUME:-sonarqube_logs}:/opt/sonarqube/logs
    restart: ${SONARQUBE_RESTART_POLICY:-unless-stopped}

  sonar-db:
    image: ${SONAR_DB_IMAGE:-postgres:15-alpine}
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: ${SONAR_DB_NAME:-sonar}
    volumes:
      - ${SONAR_DB_VOLUME:-sonar_postgres}:/var/lib/postgresql/data
    restart: ${SONAR_DB_RESTART_POLICY:-unless-stopped}

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_postgres:
