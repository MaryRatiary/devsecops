services:
  lyrx:
    build:
      context: "${APP_BUILD_CONTEXT:?APP_BUILD_CONTEXT}"
      dockerfile: "${APP_DOCKERFILE:?APP_DOCKERFILE}"
    image: "${REGISTRY:?REGISTRY}/${IMAGE_REPOSITORY:?IMAGE_REPOSITORY}:${APP_VERSION:?APP_VERSION}"
    ports:
      - "${APP_PORT:?APP_PORT}:${CONTAINER_PORT:?CONTAINER_PORT}"
    environment:
      ENV: "${APP_ENV:?APP_ENV}"
    restart: "${APP_RESTART_POLICY:?APP_RESTART_POLICY}"
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${CONTAINER_PORT}/health', timeout=5)\""
      interval: "${APP_HEALTHCHECK_INTERVAL:?APP_HEALTHCHECK_INTERVAL}"
      timeout: "${APP_HEALTHCHECK_TIMEOUT:?APP_HEALTHCHECK_TIMEOUT}"
      retries: "${APP_HEALTHCHECK_RETRIES:?APP_HEALTHCHECK_RETRIES}"
      start_period: "${APP_HEALTHCHECK_START_PERIOD:?APP_HEALTHCHECK_START_PERIOD}"

  jenkins:
    build:
      context: "${JENKINS_BUILD_CONTEXT:?JENKINS_BUILD_CONTEXT}"
      dockerfile: "${JENKINS_DOCKERFILE:?JENKINS_DOCKERFILE}"
    image: "${JENKINS_IMAGE:?JENKINS_IMAGE}"
    user: "${JENKINS_USER:?JENKINS_USER}"
    ports:
      - "${JENKINS_HTTP_PORT:?JENKINS_HTTP_PORT}:${JENKINS_CONTAINER_HTTP_PORT:?JENKINS_CONTAINER_HTTP_PORT}"
      - "${JENKINS_AGENT_PORT:?JENKINS_AGENT_PORT}:${JENKINS_CONTAINER_AGENT_PORT:?JENKINS_CONTAINER_AGENT_PORT}"
    volumes:
      - type: bind
        source: "${JENKINS_HOME_VOLUME:?JENKINS_HOME_VOLUME}"
        target: "${JENKINS_HOME_PATH:?JENKINS_HOME_PATH}"
      - type: bind
        source: "${DOCKER_SOCKET:?DOCKER_SOCKET}"
        target: "${DOCKER_SOCKET_TARGET:?DOCKER_SOCKET_TARGET}"
    restart: "${JENKINS_RESTART_POLICY:?JENKINS_RESTART_POLICY}"

  sonarqube:
    image: "${SONARQUBE_IMAGE:?SONARQUBE_IMAGE}"
    depends_on:
      - sonar-db
    ports:
      - "${SONARQUBE_PORT:?SONARQUBE_PORT}:${SONARQUBE_CONTAINER_PORT:?SONARQUBE_CONTAINER_PORT}"
    environment:
      SONAR_JDBC_URL: "jdbc:postgresql://sonar-db:${SONAR_DB_CONTAINER_PORT:?SONAR_DB_CONTAINER_PORT}/${SONAR_DB_NAME:?SONAR_DB_NAME}"
      SONAR_JDBC_USERNAME: "${SONAR_DB_USER:?SONAR_DB_USER}"
      SONAR_JDBC_PASSWORD: "${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD}"
    volumes:
      - type: bind
        source: "${SONARQUBE_DATA_VOLUME:?SONARQUBE_DATA_VOLUME}"
        target: "${SONARQUBE_DATA_PATH:?SONARQUBE_DATA_PATH}"
      - type: bind
        source: "${SONARQUBE_EXTENSIONS_VOLUME:?SONARQUBE_EXTENSIONS_VOLUME}"
        target: "${SONARQUBE_EXTENSIONS_PATH:?SONARQUBE_EXTENSIONS_PATH}"
      - type: bind
        source: "${SONARQUBE_LOGS_VOLUME:?SONARQUBE_LOGS_VOLUME}"
        target: "${SONARQUBE_LOGS_PATH:?SONARQUBE_LOGS_PATH}"
    restart: "${SONARQUBE_RESTART_POLICY:?SONARQUBE_RESTART_POLICY}"

  sonar-db:
    image: "${SONAR_DB_IMAGE:?SONAR_DB_IMAGE}"
    environment:
      POSTGRES_USER: "${SONAR_DB_USER:?SONAR_DB_USER}"
      POSTGRES_PASSWORD: "${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD}"
      POSTGRES_DB: "${SONAR_DB_NAME:?SONAR_DB_NAME}"
    volumes:
      - type: bind
        source: "${SONAR_DB_VOLUME:?SONAR_DB_VOLUME}"
        target: "${SONAR_DB_DATA_PATH:?SONAR_DB_DATA_PATH}"
    restart: "${SONAR_DB_RESTART_POLICY:?SONAR_DB_RESTART_POLICY}"
