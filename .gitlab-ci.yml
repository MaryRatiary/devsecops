stages:
  - lint
  - test
  - build
  - scan
  - push
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  REGISTRY: harbor.example.com
  REGISTRY_USER: $HARBOR_USER
  REGISTRY_PASSWORD: $HARBOR_PASSWORD
  IMAGE_NAME: $REGISTRY/mlops/ml-model
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

lint:
  stage: lint
  image: python:3.11
  script:
    - pip install flake8 black
    - flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
    - black --check src/

test:
  stage: test
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
    - pytest tests/ -v --cov=src --cov-report=term

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASSWORD $REGISTRY
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -f docker/Dockerfile .
    - docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest

scan:
  stage: scan
  image: aquasec/trivy:latest
  script:
    - trivy image --severity HIGH,CRITICAL $IMAGE_NAME:$IMAGE_TAG
  allow_failure: true

push_harbor:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASSWORD $REGISTRY
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H $DEPLOY_SERVER >> ~/.ssh/known_hosts
    - scp -i ~/.ssh/deploy_key docker-compose.yml $DEPLOY_USER@$DEPLOY_SERVER:/opt/ml-app/
    - scp -i ~/.ssh/deploy_key .env.production $DEPLOY_USER@$DEPLOY_SERVER:/opt/ml-app/.env
    - ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_SERVER "cd /opt/ml-app && docker-compose pull && docker-compose up -d"
  only:
    - main
  environment:
    name: production
